[environment]
python-version = "3.12"
extra-paths = ["triton/common"]

# Triton's production-only GPU/ML dependencies and its server-provided Python
# backend module are intentionally absent from the lean local test environment.
[[overrides]]
include = ["triton/common/**"]
rules.unresolved-import = "ignore"

[rules]
unresolved-import = "warn"
no-matching-overload = "ignore"
unknown-argument = "ignore"
unresolved-attribute = "warn"
invalid-argument-type = "warn"
invalid-assignment = "warn"
